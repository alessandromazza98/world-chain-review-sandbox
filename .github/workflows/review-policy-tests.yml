name: Review policy tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: review-policy-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test policy and GitHub orchestration
        run: node --test scripts/review-policy/*.test.cjs
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: actionlint@1.7.12
      - name: Lint review and affected CI workflows
        run: >-
          actionlint -shellcheck='' -pyflakes=''
          .github/workflows/review-policy.yml
          .github/workflows/review-policy-events.yml
          .github/workflows/review-policy-tests.yml
          .github/workflows/review-policy-sandbox-ai.yml
          .github/workflows/rust-ci.yml
          .github/workflows/foundry.yml
          .github/workflows/verify-measurements.yml
